[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aspective"
version = "0.1.0.dev0"
description = "Peer-reviewed variants of classic estimators, with the scikit-learn API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Oliver Hennhöfer" }]
keywords = ["machine learning", "scikit-learn", "anomaly detection", "ensembles"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.7",
]

[project.optional-dependencies]
pyod = ["pyod>=2.0"]
test = ["pytest>=7", "pyod>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aspective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
