site_name: aspective
site_description: Peer-reviewed variants of classic estimators that never made it into scikit-learn, with the scikit-learn API and a public benchmark gate.
site_author: Oliver Hennhöfer
site_url: https://oliverhennhoefer.github.io/aspective/
repo_url: https://github.com/OliverHennhoefer/aspective
repo_name: OliverHennhoefer/aspective
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Oliver Hennhöfer

docs_dir: docs
site_dir: site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/chart-bell-curve-cumulative
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Choosing an estimator: user_guide/choosing.md
  - Benchmarks: benchmarks.md
  - API reference:
      - api/index.md
      - Discriminant analysis: api/discriminant_analysis.md
      - Naive Bayes: api/naive_bayes.md
      - Nearest neighbours: api/neighbors.md
      - Ensembles: api/ensemble.md
      - Trees: api/tree.md
      - Linear models: api/linear_model.md
      - Anomaly detection: api/anomaly.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            filters: ["!^_"]
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: false
            show_signature_annotations: false
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OliverHennhoefer/aspective
