name: benchmarks

# The full benchmark takes about an hour, so it never runs on ordinary pushes.
# Start it by hand (Actions > benchmarks > Run workflow) after adding or
# changing a model, then commit the uploaded results. The fast gate check in
# tests/test_benchmark_gate.py runs on every push with the normal tests.
on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Benchmarks to run, space separated (empty: all)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ASPECTIVE_BENCH_CACHE: ${{ github.workspace }}/.bench-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Restore dataset and score cache
        uses: actions/cache@v4
        with:
          path: .bench-cache
          key: bench-${{ hashFiles('benchmarks/suites.py') }}-${{ github.sha }}
          restore-keys: bench-${{ hashFiles('benchmarks/suites.py') }}-
      - name: Run
        run: python -m benchmarks run ${{ inputs.benchmarks }}
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/
            benchmarks/RESULTS.md
      - name: Gate
        run: python -m benchmarks check
